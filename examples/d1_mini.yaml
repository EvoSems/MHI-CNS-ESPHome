substitutions:
  # Change these for each physical air conditioner.
  deviceid: "mhi-cns-test"
  devicename: "MHI CNS Test"
  mhi_bus_id: "mhi_bus"

esphome:
  name: ${deviceid}
  friendly_name: ${devicename}

esp8266:
  board: d1_mini
  enable_serial: true

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

button:
  - platform: restart
    name: Restart

ota:
  platform: esphome

external_components:
  - source:
      type: local
      path: ../components
    components: [mhi_cns]

mhi_cns:
  id: ${mhi_bus_id}
  frame_size: 33
  command_retries: 3
  sck_pin: 14
  mosi_pin: 13
  miso_pin: 12

climate:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    name: ${devicename}

switch:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    auto_3d:
      name: 3D Auto

select:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    vertical_vanes:
      name: Vertical Vanes
    horizontal_vanes:
      name: Horizontal Vanes

sensor:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    frame_errors:
      name: Frame Errors
    valid_frames:
      name: Valid Frames
    success_rate:
      name: Communication Success Rate
    last_valid_frame_age:
      name: Last Valid Frame Age
    clock_timeouts:
      name: Clock Timeouts
    signature_errors:
      name: Signature Errors
    checksum_errors:
      name: Checksum Errors

binary_sensor:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    compressor_running:
      name: Compressor Running
