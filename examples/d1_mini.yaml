substitutions:
  # Change these for each physical air conditioner.
  deviceid: "mhi-cns-test"
  devicename: "MHI CNS Test"
  mhi_bus_id: "mhi_bus"

esphome:
  name: ${deviceid}
  friendly_name: ${devicename}

esp8266:
  board: d1_mini
  enable_serial: true

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

button:
  - platform: restart
    name: Restart

ota:
  platform: esphome

external_components:
  - source:
      type: local
      path: ../components
    components: [mhi_cns]

mhi_cns:
  id: ${mhi_bus_id}
  # Set false to keep MHI sensor entities out of Home Assistant.
  show_sensors: true
  frame_size: 33
  command_retries: 3
  sck_pin: 14
  mosi_pin: 13
  miso_pin: 12

climate:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    name: ${devicename}

switch:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    auto_3d:
      name: 3D Auto

select:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    vertical_vanes:
      name: Vertical Vanes
    horizontal_vanes:
      name: Horizontal Vanes

sensor:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    error_code:
      name: Error Code
    indoor_temperature:
      name: Indoor Temperature
    outdoor_temperature:
      name: Outdoor Temperature
    return_air_temperature:
      name: Return Air Temperature
    current:
      name: AC Current
    compressor_frequency:
      name: Compressor Frequency
    energy_this_run:
      name: Energy This Run
    indoor_coil_u_bend:
      name: Indoor Heat Exchanger U-Bend
    indoor_coil_capillary:
      name: Indoor Heat Exchanger Capillary
    indoor_coil_header:
      name: Indoor Heat Exchanger Suction Header
    outdoor_heat_exchanger_temperature:
      name: Outdoor Heat Exchanger Temperature
    discharge_pipe_temperature:
      name: Discharge Pipe Temperature
    discharge_superheat:
      name: Discharge Pipe Superheat
    expansion_valve:
      name: Expansion Valve
    indoor_fan_speed:
      name: Indoor Fan Speed
    outdoor_fan_speed:
      name: Outdoor Fan Speed
    protection_code:
      name: Protection Code
    indoor_run_hours:
      name: Indoor Unit Run Hours
    compressor_run_hours:
      name: Compressor Run Hours
    frame_errors:
      name: Frame Errors
    valid_frames:
      name: Valid Frames
    success_rate:
      name: Communication Success Rate
    last_valid_frame_age:
      name: Last Valid Frame Age
    clock_timeouts:
      name: Clock Timeouts
    signature_errors:
      name: Signature Errors
    checksum_errors:
      name: Checksum Errors
    command_failures:
      name: Command Failures

binary_sensor:
  - platform: mhi_cns
    mhi_cns_id: ${mhi_bus_id}
    healthy:
      name: CNS Communication Healthy
    defrost:
      name: Defrost
    compressor_running:
      name: Compressor Running
