esphome:
  name: mhi-cns-test
  friendly_name: MHI CNS Test

esp8266:
  board: d1_mini
  enable_serial: true

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  platform: esphome

external_components:
  - source:
      type: local
      path: ../components
    components: [mhi_cns]

mhi_cns:
  id: mhi_bus
  frame_size: 33
  command_retries: 3
  sck_pin: 14
  mosi_pin: 13
  miso_pin: 12

climate:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    name: Air Conditioner

switch:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    power:
      name: MHI Power

sensor:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    frame_errors:
      name: Frame Errors
    valid_frames:
      name: Valid Frames
    success_rate:
      name: Communication Success Rate
    last_valid_frame_age:
      name: Last Valid Frame Age
