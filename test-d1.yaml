esphome:
  name: mhi-cns-compile-test

esp8266:
  board: d1_mini
  enable_serial: true

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: components
    components: [mhi_cns]

mhi_cns:
  id: mhi_bus
  frame_size: 33
  command_retries: 3

climate:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    name: Test Climate

switch:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    auto_3d:
      name: Test 3D Auto

select:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    vertical_vanes:
      name: Vertical Vanes
    horizontal_vanes:
      name: Horizontal Vanes

sensor:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    frame_errors:
      name: Frame Errors
    valid_frames:
      name: Valid Frames
    success_rate:
      name: Success Rate
    last_valid_frame_age:
      name: Last Valid Frame Age
    clock_timeouts:
      name: Clock Timeouts
    signature_errors:
      name: Signature Errors
    checksum_errors:
      name: Checksum Errors
    command_failures:
      name: Command Failures
    error_code: {name: Error Code}
    indoor_temperature: {name: Indoor Temperature}
    outdoor_temperature: {name: Outdoor Temperature}
    return_air_temperature: {name: Return Air Temperature}
    current: {name: Current}
    compressor_frequency: {name: Compressor Frequency}
    energy_this_run: {name: Energy This Run}
    indoor_coil_u_bend: {name: Indoor Coil U Bend}
    indoor_coil_capillary: {name: Indoor Coil Capillary}
    indoor_coil_header: {name: Indoor Coil Header}
    outdoor_heat_exchanger_temperature: {name: Outdoor Heat Exchanger Temperature}
    discharge_pipe_temperature: {name: Discharge Pipe Temperature}
    discharge_superheat: {name: Discharge Superheat}
    expansion_valve: {name: Expansion Valve}
    indoor_fan_speed: {name: Indoor Fan Speed}
    outdoor_fan_speed: {name: Outdoor Fan Speed}
    protection_code: {name: Protection Code}
    indoor_run_hours: {name: Indoor Run Hours}
    compressor_run_hours: {name: Compressor Run Hours}

binary_sensor:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    healthy: {name: Communication Healthy}
    defrost: {name: Defrost}
    compressor_running: {name: Compressor Running}
