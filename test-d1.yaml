esphome:
  name: mhi-cns-compile-test

esp8266:
  board: d1_mini
  enable_serial: true

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: components
    components: [mhi_cns]

mhi_cns:
  id: mhi_bus
  frame_size: 33
  command_retries: 3

climate:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    name: Test Climate

switch:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    power:
      name: Test Power
    auto_3d:
      name: Test 3D Auto

select:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    vertical_vanes:
      name: Vertical Vanes
    horizontal_vanes:
      name: Horizontal Vanes

sensor:
  - platform: mhi_cns
    mhi_cns_id: mhi_bus
    frame_errors:
      name: Frame Errors
    valid_frames:
      name: Valid Frames
    success_rate:
      name: Success Rate
    last_valid_frame_age:
      name: Last Valid Frame Age
    clock_timeouts:
      name: Clock Timeouts
    signature_errors:
      name: Signature Errors
    checksum_errors:
      name: Checksum Errors
